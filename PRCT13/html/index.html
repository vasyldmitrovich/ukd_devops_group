<!DOCTYPE html>
<html lang="en"> <head>
    <meta charset="UTF-8">
    <title>Docker Web Server</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef2f3; padding-top: 50px; }
        .container { border: 1px solid #ccc; display: inline-block; padding: 20px; border-radius: 10px; background: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Docker Web Server 🚀</h1>
        <p>Hostname: <b id="host"></b></p>
        <p>Current time: <span id="time"></span></p>
    </div>

    <script>
        // Виводимо дату англійською мовою
        document.getElementById('time').innerText = new Date().toLocaleString('en-US');
        document.getElementById('host').innerText = window.location.hostname;
    </script>
</body>
</html><!DOCTYPE html>
<html>

        document.getElementById('time').innerText = new Date().toLocaleString();

</html>
