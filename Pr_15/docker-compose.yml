version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: web-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always

  app:
    build: ./app
    container_name: python-app
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=pass
      - DB_NAME=app_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mariadb:10.6
    container_name: app-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pass
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  adminer:
    image: adminer
    container_name: db-adminer
    ports:
      - "8081:8080"
    profiles:
      - debug
    depends_on:
      - db

volumes:
  db_data:version: '3.8'

