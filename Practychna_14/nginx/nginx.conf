events {}
http {
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types text/plain text/css application/javascript;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
