<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Docker Web</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #282c34; color: white; text-align: center; padding-top: 100px; }
        .box { background: #1e2227; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .highlight { color: #61dafb; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔥 Мій сайт змінився через Volume!</h1>
        <p>Container Hostname: <span class="highlight"></span></p>
        <p>Current Time: <span class="highlight" id="time"></span></p>
    </div>
    <script>
        setInterval(() => {
            document.getElementById('time').innerText = new Date().toLocaleString();
        }, 1000);
    </script>
</body>
</html>
