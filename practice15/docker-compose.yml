version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: app_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: ./app
    container_name: python_app
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASS: pass
      DB_NAME: app_db
    depends_on:
      db:
        condition: service_healthy # Зачекає, поки БД повністю запуститься
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: proxy_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    restart: unless-stopped

  # BONUS: Adminer з використанням profiles
  adminer:
    image: adminer
    container_name: db_adminer
    ports:
      - "8081:8080"
    profiles:
      - dev
    restart: unless-stopped

volumes:
  db_data:
