<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Docker Web Server</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 320px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .label {
            opacity: 0.8;
            font-size: 14px;
        }

        .value {
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🚀 Docker Web Server</h1>

        <div>
            <span class="label">Hostname</span>
            <span class="value" id="host">loading...</span>
        </div>

        <div>
            <span class="label">Current time</span>
            <span class="value" id="time">loading...</span>
        </div>

        <div class="footer">
            Running inside Docker container
        </div>
    </div>

    <script>
        function updateTime() {
            document.getElementById('time').innerText =
                new Date().toLocaleString();
        }

        document.getElementById('host').innerText = window.location.hostname;

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
