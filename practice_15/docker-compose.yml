version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: db_service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: python:3.9-slim
    container_name: app_service
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./app:/app
    environment:
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pass
      - DB_HOST=db
    command: >
      sh -c "pip install -r requirements.txt && python main.py"

  web:
    image: nginx:latest
    container_name: nginx_service
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    profiles:
      - debug

volumes:
  db_data:
